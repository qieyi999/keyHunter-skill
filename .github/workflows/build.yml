name: 编译简阅APK

on:
  push:
    branches: [ jianyue ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: 安装Android SDK组件
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/ct.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" "build-tools;36.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.0.12077973" >/dev/null 2>&1
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SDK装好了"

      - name: 编译
        run: |
          export GRADLE_OPTS="-Xmx4g"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: jianyue-apk
          path: app/build/outputs/apk/release/*.apk
